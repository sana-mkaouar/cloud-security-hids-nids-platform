!
upgrade fpd auto
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname COEUR
!
boot-start-marker
boot-end-marker
!
logging message-counter syslog
!
no aaa new-model
ip source-route
no ip icmp rate-limit unreachable
ip cef
!
!
!
!
no ip domain lookup
no ipv6 cef
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
archive
 log config
  hidekeys
! 
!
!
!
!
ip tcp synwait-time 5
!
!
!
!
interface Loopback0
 ip address 1.1.1.1 255.255.255.255
!
interface FastEthernet0/0
 description Vers DC
 ip address 10.0.0.17 255.255.255.252
 duplex half
 mpls ip
!
interface ATM1/0
 no ip address
 shutdown
 no atm ilmi-keepalive
!
interface FastEthernet2/0
 description Vers DMZ
 ip address 10.0.0.21 255.255.255.252
 duplex half
 mpls ip
!
interface FastEthernet3/0
 description Vers VOIEIP1
 ip address 10.0.0.4 255.255.255.254
 duplex auto
 speed auto
 mpls ip
!
interface FastEthernet3/1
 ip address 10.0.0.6 255.255.255.254
 duplex auto
 speed auto
 mpls ip
!
interface GigabitEthernet4/0
 ip address 10.0.0.8 255.255.255.254
 negotiation auto
 mpls label protocol ldp
 mpls ip
!
router ospf 1
 router-id 1.1.1.1
 log-adjacency-changes
 network 1.1.1.1 0.0.0.0 area 0
 network 5.5.5.5 0.0.0.0 area 0
 network 10.0.0.0 0.0.0.1 area 0
 network 10.0.0.2 0.0.0.1 area 0
 network 10.0.0.4 0.0.0.1 area 0
 network 10.0.0.6 0.0.0.1 area 0
 network 10.0.0.8 0.0.0.1 area 0
 network 10.0.0.0 0.0.0.255 area 0
 network 10.0.0.0 0.255.255.255 area 0
!
ip forward-protocol nd
no ip http server
no ip http secure-server
!
!
!
no cdp log mismatch duplex
!
!
!
!
!
mpls ldp router-id Loopback0 force
!
control-plane
!
!
!
!
!
!
!
gatekeeper
 shutdown
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line vty 0 4
 login
!
end
