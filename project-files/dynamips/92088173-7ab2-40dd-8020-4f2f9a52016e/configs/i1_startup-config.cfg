!
upgrade fpd auto
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname R1
!
boot-start-marker
boot-end-marker
!
logging message-counter syslog
!
no aaa new-model
ip source-route
no ip icmp rate-limit unreachable
ip cef
!
!
!
!
no ip domain lookup
no ipv6 cef
!
multilink bundle-name authenticated
no mpls ip
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
archive
 log config
  hidekeys
! 
!
!
!
!
ip tcp synwait-time 5
!
!
!
!
interface FastEthernet0/0
 description Lien vers Internet (Cloud)
 ip address dhcp
 ip nat outside
 ip virtual-reassembly
 duplex half
 mpls ip
!
interface ATM1/0
 no ip address
 shutdown
 no atm ilmi-keepalive
!
interface FastEthernet2/0
 description Lien vers VOIEIP1
 ip address 10.0.0.1 255.255.255.252
 ip nat inside
 ip virtual-reassembly
 duplex half
 mpls ip
!
interface FastEthernet3/0
 description Lien vers R3
 ip address 10.0.0.5 255.255.255.252
 ip nat inside
 ip virtual-reassembly
 duplex auto
 speed auto
 mpls ip
!
interface FastEthernet3/1
 no ip address
 shutdown
 duplex auto
 speed auto
!
interface GigabitEthernet4/0
 no ip address
 shutdown
 negotiation auto
!
interface Serial5/0
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial5/1
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial5/2
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial5/3
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial6/0
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial6/1
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial6/2
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial6/3
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial6/4
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial6/5
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial6/6
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial6/7
 no ip address
 shutdown
 serial restart-delay 0
!
router ospf 1
 log-adjacency-changes
 network 10.0.0.20 0.0.0.1 area 0
 network 10.0.0.22 0.0.0.1 area 0
 network 10.0.0.0 0.0.0.255 area 0
 network 10.10.10.0 0.0.0.255 area 0
 default-information originate
!
ip forward-protocol nd
ip route 0.0.0.0 0.0.0.0 198.51.100.1
no ip http server
no ip http secure-server
!
!
ip nat inside source list 1 interface FastEthernet0/0 overload
!
access-list 1 permit 10.0.0.0 0.255.255.255
access-list 1 permit 10.100.0.0 0.0.0.255
access-list 1 permit 172.16.10.0 0.0.0.255
access-list 1 permit 172.16.0.0 0.15.255.255
access-list 1 permit 192.168.0.0 0.0.255.255
no cdp log mismatch duplex
!
!
!
!
!
!
control-plane
!
!
!
!
!
!
!
gatekeeper
 shutdown
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line vty 0 4
 login
!
end
