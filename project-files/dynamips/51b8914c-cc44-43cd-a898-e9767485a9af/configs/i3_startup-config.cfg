!
upgrade fpd auto
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname R3
!
boot-start-marker
boot-end-marker
!
logging message-counter syslog
!
no aaa new-model
ip source-route
no ip icmp rate-limit unreachable
ip cef
!
!
!
!
no ip domain lookup
no ipv6 cef
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
archive
 log config
  hidekeys
! 
!
!
!
!
ip tcp synwait-time 5
!
!
!
!
interface Loopback0
 ip address 6.6.6.6 255.255.255.255
!
interface FastEthernet0/0
 ip address 10.0.0.25 255.255.255.254
 duplex half
 mpls label protocol ldp
 mpls ip
!
interface ATM1/0
 no ip address
 shutdown
 no atm ilmi-keepalive
!
interface FastEthernet2/0
 ip address 10.0.0.3 255.255.255.254
 duplex half
 mpls ip
!
interface FastEthernet3/0
 ip address 10.0.0.16 255.255.255.254
 duplex auto
 speed auto
 mpls ip
!
interface FastEthernet3/1
 ip address 10.0.0.23 255.255.255.254
 duplex auto
 speed auto
 mpls ip
!
interface GigabitEthernet4/0
 no ip address
 shutdown
 negotiation auto
!
router ospf 1
 log-adjacency-changes
 network 3.3.3.3 0.0.0.0 area 0
 network 6.6.6.6 0.0.0.0 area 0
 network 10.0.0.2 0.0.0.1 area 0
 network 10.0.0.16 0.0.0.1 area 0
 network 10.0.0.22 0.0.0.1 area 0
 network 10.0.0.24 0.0.0.1 area 0
 network 10.0.0.0 0.0.0.255 area 0
!
ip forward-protocol nd
no ip http server
no ip http secure-server
!
!
!
no cdp log mismatch duplex
!
!
!
!
!
mpls ldp router-id Loopback0 force
!
control-plane
!
!
!
!
!
!
!
gatekeeper
 shutdown
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line vty 0 4
 login
!
end
